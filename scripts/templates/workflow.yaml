# Generated by scripts/new-benchmark-run.sh — one workflow per model,
# because a workflow's model is static (peonmaxxer cannot pick models
# dynamically yet). Regenerating for the same model is idempotent.
version: 0
name: bench-__SLUG__
steps:
  - id: scaffold
    kind: command
    run: scripts/ensure-scaffold.sh __SLUG__ {{.Task.ID}}
    timeout: 2m

  - id: implement
    kind: agent
    adapter: opencode
    profile: opencode
    model: __MODEL__
    permissions: standard-dev
    expect_commits: true
    budget:
      max_wall: 60m
      max_turns: 120
    prompt: |
      {{.Task.Body}}

      Rules of engagement:
      - Work ONLY inside the task directory named above. Everything under
        src/benchmark/, scripts/ and .peonmaxxer/ is read-only reference.
      - Commit your work with git as you go (conventional commits).
      - The acceptance gate that will be run for you afterwards is:
        {{.Task.Verify}}
        If your session sandbox cannot run parts of that toolchain, rely
        on careful reading and the gate's feedback loop instead.

  - id: verify
    kind: command
    run: "{{.Task.Verify}}"
    timeout: 25m
    on_fail:
      action: goto
      step: implement
      max: 2

  - id: push
    kind: push

  - id: pr
    kind: pr
    title: "bench(__SLUG__): {{.Task.ID}} {{.Task.Title}}"
    body: |
      **model:** `__MODEL__` (__LOCALITY__) · **harness:** `opencode` · **time to complete:** {{.Run.Elapsed}} · **tokens in/out:** {{.Run.InTokens}} / {{.Run.OutTokens}}

      ## Task

      {{.Task.ID}} — {{.Task.Title}}

      ## Steps

      {{range .Steps}}- `{{.ID}}` ({{.Kind}}): {{if .Passed}}passed{{else}}FAILED{{end}}{{if .InTokens}} — {{.InTokens}}/{{.OutTokens}} tokens{{end}}
      {{end}}

      ## Verify

      ```
      {{.Task.Verify}}
      ```

      _Generated by the peonmaxxer testing facility; a fresh-session review pass follows this PR's creation and updates it in place._

  - id: review
    kind: agent
    adapter: opencode
    profile: opencode
    model: __MODEL__
    permissions: read-only
    include_diff: true
    budget:
      max_wall: 30m
      max_turns: 60
    verdict:
      require_match: "REVIEW VERDICT: (CLEAN|FINDINGS)"
    prompt: |
      You are a fresh-context adversarial reviewer. Below is the full
      diff of work implemented for this task:

      Task: {{.Task.ID}} — {{.Task.Title}}

      {{.Diff}}

      Hunt for real defects: spec violations, edge cases, broken
      invariants, misleading structure, missing accessibility, dead code.
      Judge against the task's PLAN.md contract. Do NOT restyle taste.

      Report numbered findings, most severe first, each with the file and
      why it is wrong. End your reply with exactly one line:
      `REVIEW VERDICT: CLEAN` if nothing needs fixing, or
      `REVIEW VERDICT: FINDINGS` if anything does.

  - id: applyfixes
    kind: agent
    adapter: opencode
    profile: opencode
    model: __MODEL__
    permissions: standard-dev
    budget:
      max_wall: 45m
      max_turns: 100
    prompt: |
      A fresh-session reviewer just examined the work for task
      {{.Task.ID}} ({{.Task.Title}}). Their report:

      {{range .Steps}}{{if eq .ID "review"}}{{.Result}}{{end}}{{end}}

      If the verdict was CLEAN, verify nothing is broken and stop —
      commit nothing. Otherwise implement exactly the reported findings
      (no scope creep), keeping the acceptance gate green:
      {{.Task.Verify}}
      Commit your fixes with git.

  - id: verify2
    kind: command
    run: "{{.Task.Verify}}"
    timeout: 25m
    on_fail:
      action: goto
      step: applyfixes
      max: 2

  - id: push2
    kind: push

  - id: pr2
    kind: pr
    title: "bench(__SLUG__): {{.Task.ID}} {{.Task.Title}}"
    body: |
      **model:** `__MODEL__` (__LOCALITY__) · **harness:** `opencode` · **time to complete:** {{.Run.Elapsed}} · **tokens in/out:** {{.Run.InTokens}} / {{.Run.OutTokens}}

      ## Task

      {{.Task.ID}} — {{.Task.Title}}

      ## Steps

      {{range .Steps}}- `{{.ID}}` ({{.Kind}}): {{if .Passed}}passed{{else}}FAILED{{end}}{{if .InTokens}} — {{.InTokens}}/{{.OutTokens}} tokens{{end}}
      {{end}}

      ## Review

      A fresh-session reviewer examined the diff after the first PR; its
      findings (if any) were applied by a separate fix session — see the
      `review` and `applyfixes` step results in the run's event log.

      ## Verify

      ```
      {{.Task.Verify}}
      ```
