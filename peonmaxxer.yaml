version: 0

project:
  name: peonmaxxer-testing-facility
  default_branch: main
  branch_prefix: peon/

backlog:
  path: .peonmaxxer/backlog
  # Reconcile straight to ready: benchmark tasks are generated by
  # scripts/new-benchmark-run.sh and are meant to run unattended.
  auto_activate: true

workflow:
  # Per-model workflows are generated into .peonmaxxer/workflows/ by
  # scripts/new-benchmark-run.sh and registered here under `named`.
  default: builtin:standard
  named:
    bench-opencode-muse-spark-1.2-contributor-free: .peonmaxxer/workflows/bench-opencode-muse-spark-1.2-contributor-free.yaml

gate:
  # Every benchmark task carries its own verify:; this is only the
  # fallback and must never decide a benchmark result.
  command: 'echo "no project-wide gate; benchmark tasks define verify" && true'
  protected_paths:
    - peonmaxxer.yaml
    - .peonmaxxer/
    - .github/
    - scripts/
    - src/benchmark/

concurrency: 1
max_attempts: 2
